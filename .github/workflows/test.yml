name: golden-python

# O C++ saiu da main (fica no tag v1.1.0 e na branch cpp-legacy). Este job só confere
# os vetores de referência (tests/golden/data) com um simulador independente em
# Python/numpy; os testes do Rust estão em rust.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: vetores de referencia (tests/golden) conferem com o simulador em Python
        run: |
          pip install numpy
          python3 tests/golden/check_golden.py
