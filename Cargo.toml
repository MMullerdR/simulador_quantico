# Workspace Rust do HybriD-GM, v2.0.0 (docs/09-plano-migracao-rust.md, docs/12-versao-rust.md).
# O C++/CUDA saiu da main: continua no tag v1.1.0 e na branch cpp-legacy.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
num-complex = "0.4"
thiserror = "1"
hgm-algos = { path = "crates/hgm-algos" }
hgm-gpu = { path = "crates/hgm-gpu" }
hgm-core = { path = "crates/hgm-core" }
hgm-cpu = { path = "crates/hgm-cpu" }
hgm-engine = { path = "crates/hgm-engine" }
hgm-golden = { path = "crates/hgm-golden" }

# unsafe so onde for justificado e isolado (modulo de regioes do hgm-cpu, fase 3);
# ate la, proibido em todo o workspace.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
