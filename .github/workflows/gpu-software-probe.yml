name: gpu-software-probe

# Diagnostico manual: o adaptador de software do Windows (WARP) leva ~890 s para o
# primeiro uso dos kernels de GPU (docs/09 §4.2). Cada job mede uma configuracao
# (tamanho do tile, workgroup, qual kernel roda primeiro) para ver o que reduz esse
# custo. Roda so sob demanda, em paralelo, e nao faz parte do CI normal.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { region: 12, workgroup: 256, first: region }   # controle
          - { region: 12, workgroup: 256, first: global }
          - { region: 8, workgroup: 256, first: region }
          - { region: 6, workgroup: 256, first: region }
          - { region: 4, workgroup: 256, first: region }
          - { region: 6, workgroup: 64, first: region }
    name: probe (região ${{ matrix.region }}, workgroup ${{ matrix.workgroup }}, ${{ matrix.first }} primeiro)
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: sonda
        run: cargo run --release -p hgm-gpu --example software_probe -- ${{ matrix.region }} ${{ matrix.workgroup }} ${{ matrix.first }}
