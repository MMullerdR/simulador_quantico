name: rust

# Workspace Rust (crates/). Roda nos tres sistemas porque "funciona em qualquer SO"
# e um dos criterios de docs/09-plano-migracao-rust.md. Os testes de paridade leem
# tests/golden/data (gerado pelo C++ do tag v1.1.0), entao nao precisam de GPU.
#
# Verde nos tres sistemas desde c1a3c3f (fase 3) e em 9a125bb (fase 5, com o smoke
# test dos executaveis). O compilador e o fixado em rust-toolchain.toml (a mesma versao
# precisa estar nos dois lugares).
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tests/golden/**"
      - "tests/smoke_test_rust.sh"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tests/golden/**"
      - "tests/smoke_test_rust.sh"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal -c rustfmt -c clippy
          rustup default 1.100.0
          rustc --version
          cargo --version

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets

      # Os testes de GPU passam em silencio quando nao ha adaptador; esta saida mostra qual
      # adaptador cada sistema usou (ou "SEM GPU"), para o verde nao enganar.
      - name: adaptador de GPU usado nos testes
        run: cargo test -p hgm-gpu --test parity -- --nocapture --test-threads=1

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Porta da parte de CPU de tests/smoke_test.sh: compila os tres executaveis em
      # release e confere amplitudes, taxas de sucesso e recusa de GPU/hibrido.
      - name: smoke test dos executaveis
        shell: bash
        run: bash tests/smoke_test_rust.sh
