[package]
name = "hgm-cpu"
description = "Backend de CPU do HybriD-GM (serial; paralelo com rayon na fase 3)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
hgm-core.workspace = true
rayon = "1"

[dev-dependencies]
hgm-golden.workspace = true

# `unsafe` só no módulo `shared` (`#[allow(unsafe_code)]` em lib.rs). O resto do
# workspace usa `forbid`; aqui é `deny` para permitir essa exceção local.
[lints.rust]
unsafe_code = "deny"
