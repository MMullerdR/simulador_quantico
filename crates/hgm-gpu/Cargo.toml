[package]
name = "hgm-gpu"
description = "Backend de GPU portátil (wgpu + WGSL) do HybriD-GM: spike da fase 2 de docs/09"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
hgm-core.workspace = true
thiserror.workspace = true
# Complex<f32> vira Pod: o estado sobe e desce da GPU sem copiar elemento a elemento.
num-complex = { workspace = true, features = ["bytemuck"] }
wgpu = "30"
pollster = "1"
bytemuck = "1"

[dev-dependencies]
hgm-algos.workspace = true
hgm-cpu.workspace = true

[lints]
workspace = true
